[package]
name = "fmirc"
version = "0.0.1"
edition = "2024"
description = "fmIRC"
license = "MIT"

[dependencies]
# GUI
eframe = { version = "0.33.3", default-features = false, features = ["default_fonts", "glow", "persistence", "x11", "wayland"] }
egui = "0.33.3"

# Async runtime
tokio = { version = "1.48.0", features = ["full"] }

# TLS (uses OS native: SChannel on Windows, OpenSSL on Linux)
tokio-native-tls = "0.3.1"
native-tls = "0.2.14"  # for TlsConnector::builder()

# Utilities
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.147"
tracing = "0.1.44"
tracing-subscriber = "0.3.22"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Fast incremental dev builds
[profile.dev]
opt-level = 0

# Fast release builds (for testing)
[profile.release]
opt-level = "z"
lto = "thin"        # Fast LTO (was: true/fat)
codegen-units = 16  # Parallel compile (was: 1)
strip = true

# Final distribution builds (slow but smallest)
[profile.dist]
inherits = "release"
lto = true
codegen-units = 1
