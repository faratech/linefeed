[package]
name = "fmirc"
version = "0.0.1"
edition = "2024"
description = "fmIRC"
license = "MIT"

[dependencies]
# GUI
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "persistence"] }
egui = "0.29"

# Async runtime
tokio = { version = "1", features = ["full"] }

# TLS
tokio-rustls = "0.26"
rustls = "0.23"
webpki-roots = "0.26"

# Icon
image = { version = "0.25", default-features = false, features = ["png"] }

# Utilities
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "5"
tracing = "0.1"
tracing-subscriber = "0.3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
