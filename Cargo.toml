[package]
name = "linefeed"
version = "0.0.7"
edition = "2024"
rust-version = "1.97"
description = "Linefeed IRC Client"
license = "CC-BY-4.0"
repository = "https://github.com/faratech/linefeed"

[dependencies]
# GUI (no default_fonts - we load custom fonts)
egui = "0.36.1"

# Async runtime (minimal features for lower memory)
tokio = { version = "1.53.1", features = ["rt", "net", "io-util", "sync", "time", "macros"] }

# TLS (uses OS native: SChannel on Windows, OpenSSL on Linux)
tokio-native-tls = "0.3.1"
native-tls = "0.2.18"  # for TlsConnector::builder()

# Utilities
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }
dirs = "6.0.0"
base64 = "0.23.1"  # For SASL authentication
precis-profiles = "0.1.14" # IRCv3 UTF8MAPPING=rfc8265 identifier folding
hmac = "0.13.0"
sha2 = "0.11.0"
pbkdf2 = "0.13.0"
getrandom = "0.4.3"
mimalloc = { version = "0.1.52", default-features = false }  # Lower memory allocator
same-file = "1.0.6"  # Detect replaced/rotated log files portably

# Platform-specific: eframe with x11/wayland only on Linux
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.36.1", default-features = false, features = ["glow", "persistence", "x11", "wayland"] }

# Used by cfg(unix) code paths (local time conversion), so macOS needs it too
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(not(target_os = "linux"))'.dependencies]
eframe = { version = "0.36.1", default-features = false, features = ["glow", "persistence"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
] }

# Compatibility-preserving copy of the published scanner with only its XML
# parser dependency advanced past RUSTSEC-2026-0194 and RUSTSEC-2026-0195.
# Remove this patch once crates.io publishes a scanner using quick-xml >=0.41.
[patch.crates-io]
wayland-scanner = { path = "vendor/wayland-scanner" }

# Fast incremental dev builds
[profile.dev]
opt-level = 0

# Fast release builds (for testing)
[profile.release]
opt-level = "z"
lto = "thin"        # Fast LTO (was: true/fat)
codegen-units = 16  # Parallel compile (was: 1)
strip = true

# Final distribution builds (slow but smallest)
[profile.dist]
inherits = "release"
lto = true
codegen-units = 1
