name: Sign Release Binaries

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to sign binaries for (e.g. v0.0.5)"
        required: true

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: sign-release-${{ github.ref }}-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  sign-windows-binaries:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      __COMPAT_LAYER: RunAsInvoker
    steps:
      - uses: actions/checkout@v4

      - name: Download Windows binaries from release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "binaries" | Out-Null
          gh release download "$env:TAG" --repo "$env:GITHUB_REPOSITORY" --dir "binaries" --pattern "*.exe"
          $files = Get-ChildItem -Path "binaries" -Filter "*.exe"
          if ($files.Count -eq 0) {
            throw "No .exe binaries found in release $env:TAG"
          }
          Write-Host "Found $($files.Count) executable(s) to sign."

      - name: Sign with Fara Technologies LLC (primary)
        uses: Azure/trusted-signing-action@v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: 'https://eus.codesigning.azure.net/'
          trusted-signing-account-name: 'faraCodeSigningBusiness'
          certificate-profile-name: 'Faratech'
          files-folder: '${{ github.workspace }}\binaries'
          files-folder-filter: '*.exe'
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Append Mike Fara signature
        uses: Azure/trusted-signing-action@v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: 'https://eus.codesigning.azure.net/'
          trusted-signing-account-name: 'fara-codesigning'
          certificate-profile-name: 'MikeFara'
          files-folder: '${{ github.workspace }}\binaries'
          files-folder-filter: '*.exe'
          append-signature: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify both embedded signatures
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object { [version]$_.Directory.Parent.Name } -Descending | Select-Object -First 1
          if (-not $tool) { throw 'x64 signtool.exe not found' }
          $files = @(Get-ChildItem -LiteralPath 'binaries' -Filter '*.exe' -File)
          if ($files.Count -eq 0) { throw 'No signed executables found' }
          foreach ($file in $files) {
            & $tool.FullName verify /pa /all /v $file.FullName
            if ($LASTEXITCODE -ne 0) { throw "Signature verification failed: $file" }
            & $tool.FullName verify /pa /ds 1 $file.FullName
            if ($LASTEXITCODE -ne 0) { throw "Second signature missing or invalid: $file" }
          }

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v4
        continue-on-error: true
        with:
          subject-path: 'binaries/*.exe'

      - name: Verify and re-upload signed executables to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $signedFiles = @(Get-ChildItem -Path 'binaries' -Filter '*.exe' -File)
          gh release download "$env:TAG" --pattern 'SHA256SUMS' --dir binaries --clobber --repo "$env:GITHUB_REPOSITORY"
          if ($LASTEXITCODE -ne 0) { throw 'Could not download the release checksum manifest' }
          $checksumPath = Join-Path 'binaries' 'SHA256SUMS'
          $checksums = @(Get-Content -LiteralPath $checksumPath)
          foreach ($file in $signedFiles) {
            $pattern = '^[0-9a-fA-F]{64}\s+\*?' + [regex]::Escape($file.Name) + '$'
            $checksumIndexes = @(for ($i = 0; $i -lt $checksums.Count; $i++) {
              if ($checksums[$i] -match $pattern) { $i }
            })
            if ($checksumIndexes.Count -ne 1) { throw "Expected one checksum entry for $($file.Name)" }
            $hash = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            $checksums[$checksumIndexes[0]] = "$hash  $($file.Name)"
          }
          Set-Content -LiteralPath $checksumPath -Value $checksums -Encoding utf8NoBOM
          $uploads = @($signedFiles.FullName) + @($checksumPath)
          gh release upload "$env:TAG" @uploads --clobber --repo "$env:GITHUB_REPOSITORY"
          if ($LASTEXITCODE -ne 0) { throw 'Failed to upload signed binaries and checksums' }
          Write-Host "Successfully uploaded signed binaries and checksums to $env:TAG"
